<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমরা আমরাই - মেসেঞ্জার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#080915] text-white flex flex-col h-screen max-w-md mx-auto border-x border-gray-800">

    <header class="flex items-center justify-between p-4 bg-[#0d0e1b] border-b border-gray-800 sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-gray-400 hover:text-white"><i class="fas fa-arrow-left text-lg"></i></a>
            <h1 class="text-md font-bold tracking-wide">মেসেঞ্জার আড্ডা</h1>
        </div>
        <span class="text-xs bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">গ্রুপ লাইভ</span>
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#080915]" style="scrollbar-width: none;">
        </main>

    <footer class="p-3 bg-[#0d0e1b] border-t border-gray-800 sticky bottom-0">
        <form id="message-form" class="flex items-center space-x-2">
            <input type="text" id="message-input" placeholder="মেসেজ লিখুন..." autocomplete="off" required
                class="flex-1 bg-[#111223] text-sm text-white rounded-full px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-500 border border-gray-800">
            <button type="submit" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center hover:bg-blue-700 transition">
                <i class="fas fa-paper-plane text-white text-sm"></i>
            </button>
        </form>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbP3sPDO9fIvGC9R0EqR3t6AoWd1bkGNQ",
            authDomain: "nijeder-adda.firebaseapp.com",
            projectId: "nijeder-adda",
            storageBucket: "nijeder-adda.firebasestorage.app",
            messagingSenderId: "929095493797",
            appId: "1:929095493797:web:a8d785eb349bfdac6f454c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const chatBox = document.getElementById('chat-box');
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
            else { currentUser = user; loadMessages(); }
        });

        document.getElementById('message-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('message-input').value.trim();
            if (!text || !currentUser) return;

            try {
                await addDoc(collection(db, "group_messages"), {
                    senderName: currentUser.displayName,
                    senderEmail: currentUser.email,
                    senderPhoto: currentUser.photoURL,
                    messageText: text,
                    timestamp: serverTimestamp()
                });
                document.getElementById('message-input').value = '';
            } catch (error) { console.error(error); }
        });

        function loadMessages() {
            const q = query(collection(db, "group_messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = data.senderEmail === currentUser.email;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'} items-end space-x-2 mb-2`;

                    msgDiv.innerHTML = `
                        ${!isMe ? `<img src="${data.senderPhoto || 'https://via.placeholder.com/150'}" class="w-6 h-6 rounded-full border border-gray-700">` : ''}
                        <div class="max-w-[75%]">
                            ${!isMe ? `<p class="text-[9px] text-gray-500 ml-1 mb-0.5">${data.senderName}</p>` : ''}
                            <div class="px-3 py-1.5 text-sm rounded-2xl ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-800 text-gray-200 rounded-bl-none'}">
                                ${data.messageText}
                            </div>
                        </div>
                    `;
                    chatBox.appendChild(msgDiv);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
