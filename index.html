<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমরা আমরাই - Pro Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #050505; color: #e4e6eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .glass { background: rgba(24, 25, 26, 0.95); backdrop-filter: blur(10px); }
        .bubble-me { background: #0084ff; color: white; border-radius: 18px 18px 4px 18px; }
        .bubble-other { background: #3a3b3c; color: white; border-radius: 18px 18px 18px 4px; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div id="auth" class="glass p-10 rounded-3xl text-center shadow-2xl border border-gray-800">
        <i class="fa-brands fa-facebook-messenger text-6xl text-blue-500 mb-6"></i>
        <h1 class="text-3xl font-bold mb-2">আমরা আমরাই</h1>
        <p class="text-gray-400 mb-8">সবাই সবার সাথে, একদম সুরক্ষিত</p>
        <button id="login" class="bg-blue-600 hover:bg-blue-700 w-full py-3 rounded-xl font-semibold transition">Google দিয়ে শুরু করুন</button>
    </div>

    <div id="app" class="hidden w-full max-w-md h-full flex flex-col bg-[#18191a] shadow-2xl">
        <header class="p-4 border-b border-gray-700 flex justify-between items-center bg-[#242526]">
            <h2 id="header" class="font-bold text-lg">গ্রুপ আড্ডা</h2>
            <button onclick="signOut(auth)" class="text-gray-400"><i class="fa-solid fa-right-from-bracket"></i></button>
        </header>

        <nav class="flex p-2 bg-[#242526]">
            <button id="btn-group" class="flex-1 py-2 rounded-lg bg-gray-700 text-sm font-bold">গ্রুপ</button>
            <button id="btn-personal" class="flex-1 py-2 rounded-lg text-sm font-bold ml-2">পার্সোনাল</button>
        </nav>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <form id="form" class="p-4 glass border-t border-gray-700 flex gap-2">
            <input id="input" type="text" placeholder="মেসেজ লিখুন..." class="flex-1 bg-gray-800 rounded-full px-4 py-2 outline-none">
            <button type="submit" class="text-blue-500 text-xl px-2"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyBbP3sPDO9fIvGC9R0EqR3t6AoWd1bkGNQ", authDomain: "nijeder-adda.firebaseapp.com", projectId: "nijeder-adda", storageBucket: "nijeder-adda.firebasestorage.app", messagingSenderId: "929095493797", appId: "1:929095493797:web:a8d785eb349bfdac6f454c" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser, currentMode = 'group', chatID = 'global';

        onAuthStateChanged(auth, user => {
            if(user) {
                currentUser = user;
                document.getElementById('auth').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                setDoc(doc(db, "users", user.uid), { name: user.displayName, uid: user.uid }, {merge: true});
                loadMessages();
            } else {
                document.getElementById('auth').classList.remove('hidden');
                document.getElementById('app').classList.add('hidden');
            }
        });

        document.getElementById('login').onclick = () => signInWithPopup(auth, provider);

        // UI Logic
        document.getElementById('btn-group').onclick = () => { currentMode='group'; loadMessages(); };
        document.getElementById('btn-personal').onclick = () => { currentMode='list'; renderUsers(); };

        function loadMessages() {
            document.getElementById('header').innerText = "গ্রুপ আড্ডা";
            const q = query(collection(db, "messages", chatID, "chats"), orderBy("time"));
            onSnapshot(q, snap => {
                let html = '';
                snap.forEach(d => {
                    const msg = d.data();
                    html += `<div class="${msg.uid === currentUser.uid ? 'text-right' : 'text-left'}">
                                <div class="inline-block p-3 ${msg.uid === currentUser.uid ? 'bubble-me' : 'bubble-other'} text-sm">${msg.text}</div>
                             </div>`;
                });
                document.getElementById('chat-container').innerHTML = html;
            });
        }

        async function renderUsers() {
            document.getElementById('header').innerText = "বন্ধুরা";
            const snap = await getDocs(collection(db, "users"));
            let html = '<div class="space-y-2">';
            snap.forEach(d => {
                const u = d.data();
                if(u.uid !== currentUser.uid) {
                    html += `<div class="p-3 bg-[#242526] rounded-xl flex justify-between items-center">
                                <span>${u.name}</span>
                                <button onclick="alert('কানেকশন রিকোয়েস্ট সফল!')" class="text-blue-500 font-bold text-xs">Connect</button>
                             </div>`;
                }
            });
            document.getElementById('chat-container').innerHTML = html + '</div>';
        }

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const text = document.getElementById('input').value;
            if(!text) return;
            await addDoc(collection(db, "messages", chatID, "chats"), { text, uid: currentUser.uid, time: new Date() });
            document.getElementById('input').value = '';
        };

        window.signOut = signOut;
    </script>
</body>
</html>
