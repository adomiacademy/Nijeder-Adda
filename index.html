<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমরা আমরাই - আড্ডা জোন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("Service Worker Registered"))
          .catch((err) => console.log("Service Worker Failed", err));
      }
    </script>

    <style>
        body { background-color: #080915; color: white; font-family: sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto border-x border-gray-800">

    <div id="login-screen" class="flex flex-col items-center justify-center flex-1 p-6 text-center space-y-6">
        <div class="w-20 h-20 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full flex items-center justify-center shadow-lg shadow-purple-500/20">
            <i class="fas fa-users text-white text-3xl"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold tracking-wide text-white">আমরা আমরাই</h1>
            <p class="text-sm text-gray-400 mt-2">আমাদের ক্লোজ বন্ধু-বান্ধব ও পরিবারের একান্ত আড্ডার জায়গা</p>
        </div>
        
        <button id="login-btn" class="w-full bg-white text-black font-bold py-3 px-4 rounded-full flex items-center justify-center space-x-3 hover:bg-gray-200 transition active:scale-95 shadow-lg">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" class="w-5 h-5" alt="Google">
            <span>Google অ্যাকাউন্ট দিয়ে ঢুকুন</span>
        </button>
        <p class="text-[11px] text-gray-500">🔒 শুধুমাত্র আমন্ত্রিত মেম্বারদের জন্য সুরক্ষিত।</p>
    </div>

    <div id="chat-interface" class="flex flex-col h-full hidden">
        <header class="flex items-center justify-between p-4 bg-[#0d0e1b] border-b border-gray-800 sticky top-0 z-50">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full flex items-center justify-center">
                    <i class="fas fa-users text-white text-xs"></i>
                </div>
                <div>
                    <h1 class="text-md font-bold tracking-wide">আমরা আমরাই</h1>
                    <p class="text-[10px] text-green-400"><i class="fas fa-circle text-[8px]"></i> নিওন আড্ডা লাইভ</p>
                </div>
            </div>
            <div class="flex items-center space-x-4 text-gray-400">
                <button onclick="location.reload()"><i class="fas fa-sync-alt hover:text-white"></i></button>
                <button id="logout-btn" title="Log Out" class="hover:text-red-400"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
            <div class="text-center text-gray-500 text-xs my-4">
                🔒 এখানে শুধু আমাদের মেম্বাররাই আছেন।
            </div>
        </main>

        <footer class="p-3 bg-[#0d0e1b] border-t border-gray-800 sticky bottom-0">
            <form id="message-form" class="flex items-center space-x-2">
                <input type="text" id="message-input" placeholder="গ্রুপে কিছু লিখুন..." autocomplete="off" required
                    class="flex-1 bg-[#111223] text-sm text-white rounded-full px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-purple-500 border border-gray-800">
                
                <button type="submit" class="w-10 h-10 bg-purple-600 rounded-full flex items-center justify-center hover:bg-purple-700 transition active:scale-95">
                    <i class="fas fa-paper-plane text-white text-sm"></i>
                </button>
            </form>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        // আপনার প্রোভাইড করা অরিজিনাল ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyBbP3sPDO9fIvGC9R0EqR3t6AoWd1bkGNQ",
            authDomain: "nijeder-adda.firebaseapp.com",
            projectId: "nijeder-adda",
            storageBucket: "nijeder-adda.firebasestorage.app",
            messagingSenderId: "929095493797",
            appId: "1:929095493797:web:a8d785eb349bfdac6f454c",
            measurementId: "G-J5NLCGJKGY"
        };

        // ফায়ারবেস ইনিশিয়েট করা
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById('login-screen');
        const chatInterface = document.getElementById('chat-interface');
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        let currentUser = null;

        // ইউজার লগইন অবস্থা চেক করা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                chatInterface.classList.remove('hidden');
                loadMessages(); 
            } else {
                currentUser = null;
                chatInterface.classList.add('hidden');
                loginScreen.classList.remove('hidden');
            }
        });

        // গুগল লগইন ফাংশন
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("লগইন করতে সমস্যা হয়েছে! আবার চেষ্টা করুন।");
                console.error(error);
            }
        });

        // লগআউট ফাংশন
        logoutBtn.addEventListener('click', async () => {
            if(confirm("আপনি কি লগআউট করতে চান?")) {
                await signOut(auth);
            }
        });

        // ফায়ারবেসে মেসেজ পাঠানো
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            try {
                await addDoc(collection(db, "amra_amrai_messages"), {
                    senderName: currentUser.displayName
