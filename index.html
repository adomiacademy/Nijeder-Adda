<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amra Amrai Pro | Enterprise Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="auth-screen" class="w-full max-w-sm p-8 glass-panel rounded-3xl shadow-2xl text-center">
        <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-6 rotate-3">
            <i class="fa-solid fa-comments text-white text-3xl -rotate-3"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2">Amra Amrai <span class="text-blue-500">Pro</span></h1>
        <p class="text-gray-400 mb-8 text-sm">সুরক্ষিত, দ্রুত এবং প্রফেশনাল চ্যাটিং প্ল্যাটফর্ম</p>
        <button id="google-login" class="w-full bg-white text-black font-semibold py-4 rounded-2xl hover:bg-gray-200 transition flex items-center justify-center gap-3">
            <i class="fa-brands fa-google"></i> Google দিয়ে লগইন করুন
        </button>
    </div>

    <div id="app-screen" class="hidden w-full max-w-2xl h-[90vh] glass-panel rounded-3xl overflow-hidden flex flex-col shadow-2xl">
        <header class="p-6 border-b border-gray-800 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img id="user-avatar" class="w-12 h-12 rounded-full border-2 border-blue-500" src="" alt="Profile">
                <div>
                    <h2 id="user-name" class="font-bold text-lg">---</h2>
                    <span class="text-xs text-green-500 flex items-center gap-1"><i class="fa-solid fa-circle text-[8px]"></i> অনলাইন</span>
                </div>
            </div>
            <button id="logout-btn" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-power-off"></i></button>
        </header>

        <nav class="px-6 py-2 flex gap-4 border-b border-gray-800">
            <button id="tab-group" class="px-4 py-2 text-sm font-semibold border-b-2 border-blue-500 transition">গ্রুপ চ্যাট</button>
            <button id="tab-personal" class="px-4 py-2 text-sm font-semibold border-b-2 border-transparent hover:text-blue-400 transition">পার্সোনাল চ্যাট</button>
        </nav>

        <div id="chat-viewport" class="flex-1 overflow-y-auto p-6 custom-scroll space-y-4"></div>

        <footer class="p-6 border-t border-gray-800">
            <form id="msg-form" class="flex gap-4">
                <input id="msg-input" type="text" class="flex-1 bg-gray-900 border border-gray-700 rounded-2xl px-5 py-3 outline-none focus:border-blue-500 transition" placeholder="মেসেজ লিখুন...">
                <button type="submit" class="bg-blue-600 px-6 py-3 rounded-2xl font-bold hover:bg-blue-700 transition">পাঠান</button>
            </form>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // আপনার দেওয়া কনফিগ
        const firebaseConfig = {
            apiKey: "AIzaSyBbP3sPDO9fIvGC9R0EqR3t6AoWd1bkGNQ",
            authDomain: "nijeder-adda.firebaseapp.com",
            projectId: "nijeder-adda",
            storageBucket: "nijeder-adda.firebasestorage.app",
            messagingSenderId: "929095493797",
            appId: "1:929095493797:web:a8d785eb349bfdac6f454c",
            measurementId: "G-J5NLCGJKGY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // UI Logic
        onAuthStateChanged(auth, user => {
            if(user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
                loadMessages();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        document.getElementById('google-login').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // Message Logic
        document.getElementById('msg-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            await addDoc(collection(db, "global_chat"), {
                text: input.value,
                sender: auth.currentUser.displayName,
                timestamp: serverTimestamp()
            });
            input.value = '';
        };

        function loadMessages() {
            onSnapshot(query(collection(db, "global_chat"), orderBy("timestamp")), snap => {
                let html = '';
                snap.forEach(d => {
                    const msg = d.data();
                    html += `
                        <div class="flex gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-[10px] font-bold">${msg.sender.charAt(0)}</div>
                            <div class="bg-gray-800 p-3 rounded-2xl rounded-tl-none max-w-[80%]">
                                <p class="text-[10px] text-blue-400 font-bold mb-1">${msg.sender}</p>
                                <p class="text-sm">${msg.text}</p>
                            </div>
                        </div>`;
                });
                document.getElementById('chat-viewport').innerHTML = html;
            });
        }
    </script>
</body>
</html>
